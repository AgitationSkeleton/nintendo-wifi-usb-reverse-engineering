# nwc-connector.conf  -  settings for the Nintendo Wi-Fi USB Connector.
#
# One KEY=VALUE per line. Lines starting with '#' are comments. These override the
# built-in defaults; anything left commented keeps its default. Edit this file, then
# restart nwc-connector.exe for changes to take effect.
#
# Keep this file next to nwc-connector.exe. The only things that belong in this folder
# are: nwc-connector.exe, this nwc-connector.conf, and the logs\ folder it creates.

# --- client access control -------------------------------------------------
# By default the connector only handshakes with genuine Nintendo systems (an OUI
# allow-list covering the DS / DSi / 2DS / 3DS handhelds and Wii / Wii U). If your
# console is being ignored (it can't see the connector and the log shows a
# "[security] ignoring non-Nintendo client XX:XX:XX" line, OR nothing at all and you
# suspect the list is missing your unit's OUI), uncomment the next line to accept any
# client that speaks the connector protocol:
#NWC_ANY_CLIENT=1

# --- logging ---------------------------------------------------------------
# Default is quiet: connection events + a periodic heartbeat only (small logs).
# Set to 0 for full per-frame detail (large logs) when diagnosing a problem.
#NWC_QUIET=0

# --- advanced RF / data-path tuning (rarely needed; defaults are validated) --
#NWC_TXPOWER=31            # RF3 TX power, 0-31 (31 = max)
#NWC_WD_DRAIN=24           # server->DS packets delivered per loop iteration
#NWC_PROBE_MINGAP_MS=300   # min ms between probe-responses to the same station
#NWC_DATA_TXPOWER=0        # 0 = don't re-program RF power post-association
